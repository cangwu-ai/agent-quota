<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="个人 AI Agent 额度与 token 用量监控面板">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="额度监控">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/app-180.png">
<link rel="icon" href="icons/app-180.png">
<link rel="modulepreload" href="frontend/quota-data.mjs">
<link rel="modulepreload" href="frontend/dashboard-model.mjs">
<title>Agent 额度监控</title>
<style>
/* 暗色环形图监控板（卡 04 定稿）。
   布局：桌面 = 左列合计 + 右侧 2×2 额度卡；手机竖屏 = 合计 → 2×2 卡，可滚动；手机横屏 = 左列合计 + 一排四环，不滚动。
   配色：额度环按状态着色（充足/注意/紧张，配图标+文字）；token 系列按固定分类色（蓝 Codex、橙 Claude、青 Grok、黄 Antigravity）。 */
:root {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #222221;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --ink-3: #898781;
  --grid: #2c2c2a;
  --base: #383835;
  --border: rgba(255,255,255,0.10);
  --good: #0ca30c;
  --warn: #fab219;
  --crit: #d03b3b;
  --crit-ink: #e86b6b;      /* 小字用的红：#d03b3b 在暗底上对比度不足 4.5:1 */
  --none: #898781;
  --s-codex: #3987e5;       /* categorical slot 1 */
  --s-claude: #d95926;      /* slot 2 */
  --s-grok: #199e70;        /* slot 3 */
  --s-antigravity: #c98500; /* slot 4 */
  --focus: #3987e5;
  --font: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
}
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.app { max-width: 1440px; margin: 0 auto; padding-block: 14px 20px; display: grid; gap: 14px; }
button { font: inherit; color: inherit; }
button:focus-visible, .num:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* 顶栏 */
.top { display: flex; align-items: center; gap: 10px 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 12px; margin-right: auto; }
.brand h1 { margin: 0; font-size: 17px; font-weight: 600; }
.clock { font-size: 15px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.fresh { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.fresh svg { width: 11px; height: 11px; flex: none; }
.fresh .abs { font-weight: 500; opacity: 0.85; }
.fresh.fresh-ok { color: var(--good); } .fresh.warning { color: var(--warn); } .fresh.critical { color: var(--crit-ink); } .fresh.loading { color: var(--ink-3); }
.srcs { display: flex; gap: 14px; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.src { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--base); }
.dot.d-fresh { background: var(--good); } .dot.d-warning { background: var(--warn); } .dot.d-critical { background: var(--crit); }
.tools { display: flex; gap: 6px; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 2px; }
.seg button, .tool { font-size: 12px; color: var(--ink-2); background: transparent; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; min-height: 30px; }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); }
.tool { background: var(--surface); border: 1px solid var(--border); }
.tool[aria-pressed="true"] { color: var(--ink); border-color: var(--ink-3); }

/* 提示条：断网、拉取失败、数据过期 */
.banner { display: flex; align-items: flex-start; gap: 8px; padding: 9px 14px; border-radius: 12px; font-size: 13px; border: 1px solid currentColor; background: var(--surface); }
.banner[hidden] { display: none; }
.banner svg { width: 14px; height: 14px; flex: none; margin-top: 2px; }
.banner.warning { color: var(--warn); } .banner.critical { color: var(--crit-ink); }
.banner .msg { color: var(--ink); }
.banner .msg b { color: inherit; }

/* 主体 */
.main { display: grid; gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; min-width: 0; }

/* 精确值：悬停 / 长按 / 点按显示 */
.num { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: help; border-radius: 4px; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.num .u { font-weight: 500; color: var(--ink-3); margin-left: 2px; letter-spacing: 0; }

/* 合计面板 */
.totals { padding: 18px; display: grid; gap: 16px; align-content: start; }
.label { margin: 0; font-size: 12px; font-weight: 400; color: var(--ink-3); }
.hero { display: flex; align-items: center; gap: 18px; }
.share { width: 96px; height: 96px; flex: none; }
.share .track { stroke: var(--grid); }
.big { font-size: 52px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
.big .u { font-size: 20px; margin-left: 4px; }
.big-sub { font-size: 12px; color: var(--ink-3); margin-top: 8px; font-variant-numeric: tabular-nums; }
.legend { display: grid; gap: 7px; font-size: 13px; margin: 0; padding: 0; list-style: none; }
.lg { display: grid; grid-template-columns: 10px 1fr auto 3.2em; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.sw { width: 10px; height: 10px; border-radius: 3px; }
.lg-name { color: var(--ink-2); }
.lg-val { color: var(--ink); font-weight: 500; }
.lg-pct { color: var(--ink-3); text-align: right; }
.lg.off .lg-name, .lg.off .lg-val { color: var(--ink-3); }
.lg.off .sw { background: transparent; border: 1px dashed var(--ink-3); }
.bars { position: relative; aspect-ratio: 340 / 130; } /* 预留高度，数据到达时不产生布局偏移 */
.bars svg { width: 100%; height: auto; display: block; overflow: visible; }
.bars text { font-size: 10px; fill: var(--ink-3); font-variant-numeric: tabular-nums; }
.bars .grid { stroke: var(--grid); } .bars .axis { stroke: var(--base); }
.bars .hit { fill: transparent; }
.empty { color: var(--ink-3); font-size: 12px; }
.note { margin: 0; font-size: 11px; color: var(--ink-3); }
.tip { position: fixed; z-index: 10; left: 0; top: 0; pointer-events: none; transform: translate(-50%, calc(-100% - 8px)); background: var(--ink); color: var(--page); font-size: 12px; padding: 5px 8px; border-radius: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* 额度卡 */
.gauges { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.gauge { padding: 14px; display: grid; grid-template-rows: auto 1fr auto; gap: 10px; }
.g-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 32px; height: 32px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--border); display: grid; place-items: center; flex: none; font-weight: 600; color: var(--ink-2); }
.logo img { width: 18px; height: 18px; object-fit: contain; display: block; }
.logo.wide img { width: 24px; height: 18px; }
.g-title { min-width: 0; }
.g-name { margin: 0; font-weight: 600; font-size: 15px; white-space: nowrap; }
.g-members { font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-src { margin-left: auto; font-size: 11px; color: var(--ink-3); border: 1px solid var(--border); border-radius: 5px; padding: 0 6px; white-space: nowrap; }
.ring-box { position: relative; display: grid; place-items: center; min-height: 0; }
.ring { width: 100%; max-width: 150px; aspect-ratio: 1; display: block; }
.ring .tick { stroke: var(--ink-3); }
.ring [data-f="track"] { stroke: var(--base); } /* 不支持 color-mix 时的底轨 */
.ring-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.pct { font-size: 34px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
.pct small { font-size: 0.45em; font-weight: 500; color: var(--ink-3); margin-left: 1px; }
.pct.none { color: var(--ink-3); }
.pct-label { font-size: 11px; color: var(--ink-3); margin-top: 5px; }
.pct-alt { font-size: 11px; color: var(--ink-2); margin-top: 2px; font-variant-numeric: tabular-nums; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.chip svg { width: 10px; height: 10px; }
.chip.good { color: var(--good); } .chip.warn, .chip.warning { color: var(--warn); } .chip.crit, .chip.critical { color: var(--crit-ink); } .chip.none { color: var(--none); }
.g-foot { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); }
.g-tok { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-top: 8px; border-top: 1px solid var(--grid); }
.g-tok .num { font-size: 20px; font-weight: 600; color: var(--ink); }
.g-tok .num .u { font-size: 12px; }
.g-tok .none { font-size: 13px; font-weight: 500; color: var(--ink-3); }
.g-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; white-space: nowrap; }
.g-row b { font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
.g-row.chips { justify-content: flex-start; flex-wrap: wrap; }
.g-row[hidden] { display: none; }

/* ===== 桌面宽屏：左列合计 + 右侧 2×2 ===== */
@media (min-width: 1024px) {
  .app { min-height: 100%; grid-template-rows: auto auto 1fr; padding-block: 18px; }
  .main { grid-template-columns: 400px minmax(0, 1fr); min-height: 0; }
  .gauges { grid-template-rows: 1fr 1fr; min-height: 0; }
  .gauge { padding: 18px; grid-template-columns: minmax(0, 1fr) minmax(200px, 0.9fr); grid-template-rows: auto 1fr; column-gap: 20px; }
  .g-head { grid-column: 1 / -1; }
  .ring-box { grid-row: 2; }
  .ring { max-width: 230px; }
  .pct { font-size: 48px; }
  .g-foot { grid-row: 2; align-content: center; gap: 8px; font-size: 13px; }
  .g-tok { flex-direction: column; align-items: flex-start; gap: 2px; border-top: 0; padding-top: 0; }
  .g-tok .num { font-size: 28px; }
  .totals { padding: 22px; gap: 20px; }
  .big { font-size: 64px; }
  .share { width: 112px; height: 112px; }
}

/* ===== 手机横屏全屏：左列合计 + 一排四环，不滚动 ===== */
@media (orientation: landscape) and (max-height: 500px) {
  body { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  .app { height: 100%; grid-template-rows: auto auto 1fr; gap: 8px; padding-block: 8px; }
  .top { flex-wrap: nowrap; gap: 12px; }
  .brand h1 { font-size: 14px; }
  .clock { font-size: 14px; }
  .srcs, .seg, #wake, .fresh .abs { display: none; }
  .banner { padding: 4px 10px; font-size: 12px; border-radius: 8px; }
  .main { grid-template-columns: 196px minmax(0, 1fr); gap: 8px; min-height: 0; }
  .totals { padding: 12px; gap: 10px; border-radius: 12px; align-content: space-between; }
  .hero { flex-direction: column; align-items: flex-start; gap: 10px; }
  .share { display: none; }
  .big { font-size: 48px; }
  .big .u { font-size: 16px; }
  .big-sub { margin-top: 6px; }
  .legend { font-size: 12px; gap: 5px; }
  .bars-block, .note { display: none; }
  .gauges { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; min-height: 0; }
  .gauge { padding: 10px; gap: 6px; border-radius: 12px; }
  .g-members, .g-src { display: none; }
  .logo { width: 24px; height: 24px; border-radius: 7px; }
  .logo img { width: 14px; height: 14px; } .logo.wide img { width: 18px; height: 14px; }
  .g-name { font-size: 13px; }
  .ring { max-width: 150px; }
  .pct { font-size: 38px; }
  .pct-label { margin-top: 3px; }
  .g-foot { gap: 2px; font-size: 11px; }
  .g-tok { padding-top: 5px; }
  .g-tok .num { font-size: 18px; }
  .g-row.reset, .g-row.extra { display: none; }
}
/* 平滑过渡；减少动态效果时直接跳到终值 */
@media (prefers-reduced-motion: no-preference) {
  .arc { transition: stroke-dashoffset .8s cubic-bezier(.2,.7,.2,1), stroke .4s ease; }
  .share circle { transition: stroke-dasharray .6s ease, stroke-dashoffset .6s ease; }
}
@media (forced-colors: active) { .arc { stroke: CanvasText; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>Agent 额度监控</h1><span class="clock" id="clock">--:--</span></div>
    <span class="fresh loading" id="fresh" role="status">正在读取数据…</span>
    <div class="srcs" id="srcs"></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="环形图中心显示">
        <button type="button" data-mode="used" aria-pressed="true">已用</button>
        <button type="button" data-mode="left" aria-pressed="false">剩余</button>
      </div>
      <button class="tool" id="wake" type="button" aria-pressed="false" hidden>屏幕常亮</button>
      <button class="tool" id="full" type="button" hidden>全屏</button>
    </div>
  </header>

  <div class="banner" id="banner" role="alert" hidden></div>

  <main class="main">
    <section class="panel totals" aria-labelledby="total-label">
      <h2 class="label" id="total-label">今日 token 消耗 · 全部合计</h2>
      <div class="hero">
        <svg class="share" id="share" viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="40" fill="none" stroke-width="12"/></svg>
        <div>
          <div class="big" id="total">—</div>
          <div class="big-sub" id="total-sub">&nbsp;</div>
        </div>
      </div>
      <ul class="legend" id="legend" aria-label="各 Agent 今日 token"></ul>
      <div class="bars-block">
        <h3 class="label" style="margin-bottom:8px">近 7 天 · 按 Agent 堆叠</h3>
        <div class="bars" id="bars"><div class="empty">等待数据…</div></div>
      </div>
      <p class="note">token 为当日记录（含缓存读取）。没有用量记录的池不计入合计。数字悬停、长按或点按可看精确值。</p>
    </section>
    <section class="gauges" id="gauges" aria-label="额度池"></section>
  </main>
</div>
<div class="tip" id="tip" role="tooltip" hidden></div>

<script type="module">
import { createQuotaLoader, loadQuota, startQuotaRefresh } from './frontend/quota-data.mjs';
import {
  PROVIDERS, buildCards, buildDays, sumCardTokens, headerStatus, formatCompact, formatCompactText, formatExact,
  relativeTime, absoluteTime, untilTime,
} from './frontend/dashboard-model.mjs';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ICON = {
  good: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2 5 8.5l4.5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  warn: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2.5v4.2M6 9.2v.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  crit: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3 3 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  none: '<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
};
const STALE_ICON = { fresh: ICON.good, warning: ICON.warn, critical: ICON.crit };
const LEVEL = { good: '充足', warn: '注意', crit: '紧张', none: '暂无读数' };
const STALE_TEXT = { fresh: '数据新鲜', warning: '有数据超过 30 分钟未更新', critical: '有数据超过 1 小时未更新' };
const SERIES_COLOR = Object.fromEntries(PROVIDERS.map(p => [p.provider, `var(--s-${p.provider})`]));
const R = 50, C = 2 * Math.PI * R;

// 本地验证可用 ?base=./相对目录/ 读取同源 JSON；只接受相对路径，线上默认读 data 分支。
const base = new URLSearchParams(location.search).get('base');
const load = base && /^\.\/[\w./-]*\/$/.test(base) && !base.includes('..') ? createQuotaLoader({ baseUrl: new URL(base, location.href).href }) : loadQuota;

let mode = 'used', last = null, lastError = null;

/** Compact number button; exact value via hover / long-press / tap / focus tooltip, and screen-reader text. */
function num(n, unitLabel = 'token') {
  const [v, u] = formatCompact(n), exact = formatExact(n);
  return `<button type="button" class="num" data-exact="${exact} ${unitLabel}"><span aria-hidden="true">${v}${u ? `<span class="u">${u}</span>` : ''}</span><span class="sr">${exact} ${unitLabel}</span></button>`;
}
const timeTag = (iso, now) => `<time datetime="${esc(iso)}" title="${esc(absoluteTime(iso))}">${esc(relativeTime(iso, now))}</time>`;

/* ---------- 额度卡：按池保留 DOM，只更新属性，环形图才能平滑过渡 ---------- */
function cardSkeleton(card) {
  const a = (0.8 * 360 - 90) * Math.PI / 180;
  const t = k => [60 + (R + k) * Math.cos(a), 60 + (R + k) * Math.sin(a)];
  const [x1, y1] = t(-9), [x2, y2] = t(9);
  const logo = card.logo
    ? `<img src="${esc(card.logo)}" alt="" width="18" height="18">`
    : `<span aria-hidden="true">${esc(card.name.slice(0, 1).toUpperCase())}</span>`;
  const el = document.createElement('article');
  el.className = 'panel gauge';
  el.dataset.provider = card.provider;
  el.setAttribute('aria-labelledby', `name-${card.provider}`);
  el.innerHTML = `
    <div class="g-head">
      <span class="logo${card.wide ? ' wide' : ''}">${logo}</span>
      <div class="g-title"><h2 class="g-name" id="name-${esc(card.provider)}">${esc(card.name)}</h2><div class="g-members">${esc(card.members)}</div></div>
      <span class="g-src" data-f="src"></span>
    </div>
    <div class="ring-box">
      <svg class="ring" viewBox="0 0 120 120" role="img" data-f="ring">
        <title data-f="ring-title"></title>
        <circle data-f="track" cx="60" cy="60" r="${R}" fill="none" stroke-width="10"/>
        <circle class="arc" data-f="arc" cx="60" cy="60" r="${R}" fill="none" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 60 60)"/>
        <line class="tick" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <div class="ring-center" aria-hidden="true">
        <div class="pct" data-f="pct"></div>
        <div class="pct-label" data-f="pct-label"></div>
        <div class="pct-alt" data-f="pct-alt"></div>
      </div>
    </div>
    <div class="g-foot">
      <div class="g-tok"><span>今日 token</span><span data-f="tok"></span></div>
      <div class="g-row chips" data-f="chips"></div>
      <div class="g-row reset" data-f="reset-row"><span>重置</span><b data-f="reset"></b></div>
      <div class="g-row extra" data-f="extra-row"><span data-f="extra-k"></span><b data-f="extra-v"></b></div>
    </div>`;
  return el;
}

/** Replace markup only when it changed, so periodic re-renders keep focus and open tooltips. */
function setHtml(el, html) { if (el.dataset.html !== html) { el.innerHTML = html; el.dataset.html = html; } }

function updateCard(el, card, now, loading) {
  const f = k => el.querySelector(`[data-f="${k}"]`);
  const has = card.usedPct != null;
  const used = has ? Math.round(card.usedPct) : null, left = has ? 100 - used : null;
  const color = has ? `var(--${card.level})` : 'var(--none)';
  f('src').textContent = loading ? '' : !has ? '无读数' : card.manual ? '手动' : '自动';
  // var() 只在 style 里可靠（SVG 展示属性不一定解析），同时让 CSS transition 生效
  f('track').style.stroke = `color-mix(in oklab, ${color} 20%, var(--surface))`;
  const arc = f('arc');
  arc.style.stroke = color;
  arc.style.strokeOpacity = has && card.usedPct > 0 ? '1' : '0';
  arc.dataset.target = String(C * (1 - (has ? card.usedPct : 0) / 100));
  f('ring-title').textContent = has ? `${card.name} ${card.windowLabel}已用 ${used}%，剩余 ${left}%，状态${LEVEL[card.level]}；80% 为警戒线` : `${card.name} 暂无额度读数`;
  if (has) {
    const main = mode === 'used' ? used : left;
    f('pct').className = 'pct';
    f('pct').innerHTML = `${main}<small>%</small>`;
    f('pct-label').textContent = `${card.windowLabel}${mode === 'used' ? '已用' : '剩余'}`;
    f('pct-alt').textContent = mode === 'used' ? `剩余 ${left}%` : `已用 ${used}%`;
  } else {
    f('pct').className = 'pct none';
    f('pct').textContent = '—';
    f('pct-label').textContent = loading ? '读取中…' : '暂无读数';
    f('pct-alt').textContent = '';
  }
  setHtml(f('tok'), card.tokens != null ? num(card.tokens) : `<span class="none">${loading ? '读取中…' : '无用量记录'}</span>`);

  let chips = loading ? '' : `<span class="chip ${card.level}">${ICON[card.level]}${LEVEL[card.level]}</span>`;
  // 手动、仅 token 的池同样标记：卡上任一展示中的数字过期都要提示
  if (!loading && card.stale && card.stale !== 'fresh') {
    const age = card.staleAt ? `${card.manual ? '手动' : '数据'} ${relativeTime(card.staleAt, now)}` : '更新时间未知';
    chips += `<span class="chip ${card.stale}">${STALE_ICON[card.stale]}${esc(age)}</span>`;
  }
  setHtml(f('chips'), chips || '&nbsp;');

  const reset = untilTime(card.resetsAt, now);
  f('reset-row').hidden = !reset;
  f('reset').textContent = reset ?? '';
  f('reset').title = card.resetsAt ? absoluteTime(card.resetsAt) : '';

  let extra = null;
  if (card.shortPct != null) extra = ['5 小时窗口', `${Math.round(card.shortPct)}%`];
  else if (card.manual) extra = ['手动填写', timeTag(card.readingAt, now)];
  f('extra-row').hidden = !extra;
  if (extra) { f('extra-k').textContent = extra[0]; setHtml(f('extra-v'), extra[1]); }
}

function renderGauges(cards, now, loading) {
  const box = $('gauges');
  const fresh = [];
  cards.forEach((card, i) => {
    let el = box.querySelector(`[data-provider="${CSS.escape(card.provider)}"]`);
    if (!el) { el = cardSkeleton(card); fresh.push(el); }
    // Move only when out of order: moving a node would drop keyboard focus inside it.
    if (box.children[i] !== el) box.insertBefore(el, box.children[i] ?? null);
    updateCard(el, card, now, loading);
  });
  for (const el of box.querySelectorAll('.gauge')) if (!cards.some(c => c.provider === el.dataset.provider)) el.remove();
  // New arcs start empty; set the target on the next frame so the transition plays.
  const apply = () => box.querySelectorAll('.arc').forEach(a => { a.style.strokeDashoffset = a.dataset.target; });
  if (fresh.length) requestAnimationFrame(() => requestAnimationFrame(apply)); else apply();
}

/* ---------- 合计 ---------- */
function renderTotals(result, cards) {
  const loading = !result;
  const total = result?.totalTokens ?? 0;
  const known = cards.filter(c => c.tokens != null);
  const sum = sumCardTokens(cards);
  if (sum !== total) console.warn('合计与逐池相加不一致', { total, sum });
  const days = buildDays(cards);
  const week = days.reduce((a, d) => a + d.total, 0);
  $('total').innerHTML = known.length ? num(total) : '—';
  $('total-sub').textContent = loading ? '读取中…' : known.length
    ? `精确值 ${formatExact(total)}${days.length ? ` · 近 ${days.length} 天 ${formatCompactText(week)}` : ''}`
    : '暂无 token 记录';

  // 今日占比环：段间留 2.5 单位表面色空隙
  const r = 40, c = 2 * Math.PI * r, parts = known.filter(k => k.tokens > 0);
  let off = 0, segs = `<circle class="track" cx="50" cy="50" r="${r}" fill="none" stroke-width="12"/>`;
  for (const s of parts) {
    const len = (s.tokens / total) * c, gap = parts.length > 1 ? 2.5 : 0;
    segs += `<circle cx="50" cy="50" r="${r}" fill="none" style="stroke:${SERIES_COLOR[s.provider] ?? 'var(--ink-3)'}" stroke-width="12" stroke-dasharray="${Math.max(0, len - gap)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"/>`;
    off += len;
  }
  $('share').innerHTML = segs;

  $('legend').innerHTML = cards.map(card => card.tokens != null
    ? `<li class="lg"><span class="sw" style="background:${SERIES_COLOR[card.provider] ?? 'var(--ink-3)'}"></span><span class="lg-name">${esc(card.name)}</span><span class="lg-val">${num(card.tokens)}</span><span class="lg-pct">${total ? Math.round(card.tokens / total * 100) + '%' : ''}</span></li>`
    : `<li class="lg off"><span class="sw"></span><span class="lg-name">${esc(card.name)}</span><span class="lg-val">${loading ? '…' : '无记录'}</span><span class="lg-pct"></span></li>`).join('');
  if (loading) return; // 柱图区保留“等待数据…”
  renderBars(cards, days);
}

function niceMax(v) {
  if (v <= 0) return 1;
  const p = 10 ** Math.floor(Math.log10(v));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}

function renderBars(cards, days) {
  const box = $('bars');
  if (!days.length) { box.innerHTML = '<div class="empty">暂无逐日记录</div>'; return; }
  const W = 340, H = 130, L = 40, T = 8, B = 18;
  const max = niceMax(Math.max(...days.map(d => d.total)));
  const y = v => T + (H - T - B) * (1 - v / max);
  const slot = (W - L) / days.length, bw = Math.min(20, slot * 0.55);
  const today = new Date().toLocaleDateString('sv-SE');
  let svg = `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">`;
  for (const t of [max / 2, max]) svg += `<line class="grid" x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${formatCompactText(t)}</text>`;
  svg += `<line class="axis" x1="${L}" x2="${W}" y1="${y(0)}" y2="${y(0)}"/><text x="${L - 6}" y="${y(0) + 3}" text-anchor="end">0</text>`;
  days.forEach((d, i) => {
    const cx = L + slot * i + slot / 2;
    let baseY = y(0);
    const top = d.parts.reduce((last, v, j) => (v > 0 ? j : last), -1);
    d.parts.forEach((v, j) => {
      if (!v) return;
      const h = y(0) - y(v), gap = baseY === y(0) ? 0 : 2, color = SERIES_COLOR[cards[j].provider] ?? 'var(--ink-3)';
      const yTop = baseY - h, rad = Math.min(4, Math.max(0, h - gap) / 2, bw / 2);
      svg += j === top && rad > 0
        ? `<path d="M${cx - bw / 2},${baseY - gap} V${yTop + rad} q0,-${rad} ${rad},-${rad} H${cx + bw / 2 - rad} q${rad},0 ${rad},${rad} V${baseY - gap} Z" style="fill:${color}"/>`
        : `<rect x="${cx - bw / 2}" y="${yTop}" width="${bw}" height="${Math.max(0, h - gap)}" style="fill:${color}"/>`;
      baseY = yTop;
    });
    svg += `<rect class="hit" x="${L + slot * i}" y="${T}" width="${slot}" height="${H - T - B}" data-i="${i}"/>`;
    svg += `<text x="${cx}" y="${H - 4}" text-anchor="middle">${d.day === today ? '今天' : d.day.slice(5).replace('-', '/')}</text>`;
  });
  svg += '</svg>';
  const series = cards.filter((c, j) => days.some(d => d.parts[j] > 0));
  const table = `<table class="sr"><caption>近 ${days.length} 天每日 token</caption><thead><tr><th scope="col">日期</th>${series.map(c => `<th scope="col">${esc(c.name)}</th>`).join('')}<th scope="col">合计</th></tr></thead><tbody>${
    days.map(d => `<tr><th scope="row">${d.day}</th>${series.map(c => `<td>${formatExact(d.parts[cards.indexOf(c)])}</td>`).join('')}<td>${formatExact(d.total)}</td></tr>`).join('')}</tbody></table>`;
  box.innerHTML = svg + table;
  box.querySelectorAll('.hit').forEach(hit => {
    hit.addEventListener('pointerenter', () => {
      const d = days[+hit.dataset.i];
      const text = `${d.day.slice(5)}  合计 ${formatExact(d.total)} · ` + series.map(c => `${c.name} ${formatExact(d.parts[cards.indexOf(c)])}`).join(' · ');
      const rect = hit.getBoundingClientRect();
      const k = box.querySelector('svg').getBoundingClientRect().height / H;
      showTip(text, rect.left + rect.width / 2, box.querySelector('svg').getBoundingClientRect().top + y(d.total) * k);
    });
    hit.addEventListener('pointerleave', hideTip);
  });
}

/* ---------- 顶栏状态与提示条 ---------- */
function renderStatus(result, now, cards) {
  const head = headerStatus(result, now, cards);
  const fresh = $('fresh');
  if (!result) {
    fresh.className = 'fresh loading';
    fresh.textContent = lastError ? '数据读取失败' : '正在读取数据…';
  } else if (!head.updatedAt) {
    fresh.className = 'fresh critical';
    fresh.innerHTML = `${ICON.crit}暂无自动采集数据`;
  } else {
    const lv = head.staleLevel;
    fresh.className = `fresh ${lv === 'fresh' ? 'fresh-ok' : lv}`;
    fresh.innerHTML = `${STALE_ICON[lv]}上次更新 ${timeTag(head.updatedAt, now)}<span class="abs">（${esc(absoluteTime(head.updatedAt))}）</span> · ${STALE_TEXT[lv]}`;
  }
  $('srcs').innerHTML = head.sources.map(s => `<span class="src"><span class="dot ${s.updatedAt ? `d-${s.staleLevel}` : ''}" aria-hidden="true"></span>${esc(s.label)} ${s.updatedAt ? timeTag(s.updatedAt, now) : s.failed ? '读取失败' : '无数据'}</span>`).join('');

  // 提示条：断网 / 拉取失败 / 过期，按严重程度只显示一条主信息
  const msgs = [];
  let lv = 'warning';
  const offline = navigator.onLine === false;
  const failed = result?.errors ?? [];
  if (offline) msgs.push('网络已断开，显示的是上次拉取的数据，联网后自动刷新。');
  if (!result && lastError) { msgs.push('数据读取失败，稍后自动重试。'); lv = 'critical'; }
  if (result && !head.hasData) { msgs.push('暂时拉不到任何额度数据，稍后自动重试。'); lv = 'critical'; }
  else if (failed.length && !offline) msgs.push(`部分数据拉取失败（${failed.map(e => esc(e.source)).join('、')}），已保留上次数据。`);
  if (result && head.staleItems.length) {
    const items = head.staleItems.map(i => `${esc(i.label)}${i.kind === 'card' && i.manual ? '（手动）' : ''} ${i.at ? `${esc(relativeTime(i.at, now))}（${esc(absoluteTime(i.at))}）` : '时间未知'}`);
    msgs.push(`<b>数据已过期</b>：${items.join('；')}，相关数字可能不是最新。`);
    if (head.staleLevel === 'critical') lv = 'critical';
  }
  const banner = $('banner');
  banner.hidden = !msgs.length;
  banner.className = `banner ${lv}`;
  banner.innerHTML = msgs.length ? `${lv === 'critical' ? ICON.crit : ICON.warn}<span class="msg">${msgs.join(' ')}</span>` : '';
}

let totalsFor; // 合计区只在新数据到达时重建，定时重绘不打断悬停与键盘焦点
function render() {
  const now = Date.now();
  try {
    // 首次加载前先画空卡占位，数据到达后不产生布局偏移
    const cards = buildCards(last?.pools ?? [], now);
    renderGauges(cards, now, !last);
    if (totalsFor !== last) { renderTotals(last, cards); totalsFor = last; }
    renderStatus(last, now, cards);
  } catch (error) {
    console.error('渲染失败', error);
  }
}

/* ---------- 精确值提示：悬停 / 长按 / 点按 / 键盘聚焦 ---------- */
const tip = $('tip');
function showTip(text, x, y) {
  tip.textContent = text;
  tip.hidden = false;
  const w = tip.offsetWidth / 2 + 6;
  tip.style.left = `${Math.min(Math.max(x, w), innerWidth - w)}px`;
  tip.style.top = `${Math.max(y, tip.offsetHeight + 12)}px`;
}
function hideTip() { tip.hidden = true; }
const tipFor = el => { const r = el.getBoundingClientRect(); showTip(el.dataset.exact, r.left + r.width / 2, r.top); };
let press = null;
document.addEventListener('pointerover', e => { const el = e.target.closest?.('.num'); if (el && e.pointerType === 'mouse') tipFor(el); });
document.addEventListener('pointerout', e => { if (e.target.closest?.('.num') && e.pointerType === 'mouse') hideTip(); });
document.addEventListener('pointerdown', e => {
  const el = e.target.closest?.('.num');
  clearTimeout(press);
  if (el && e.pointerType !== 'mouse') press = setTimeout(() => tipFor(el), 450);
});
for (const type of ['pointerup', 'pointercancel']) document.addEventListener(type, () => clearTimeout(press));
document.addEventListener('click', e => { const el = e.target.closest?.('.num'); if (el) tipFor(el); else if (!e.target.closest?.('.hit')) hideTip(); });
document.addEventListener('contextmenu', e => { if (e.target.closest?.('.num')) e.preventDefault(); });
document.addEventListener('focusin', e => { if (e.target.matches?.('.num:focus-visible')) tipFor(e.target); });
document.addEventListener('focusout', e => { if (e.target.matches?.('.num')) hideTip(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') hideTip(); });
addEventListener('scroll', hideTip, { passive: true });

/* ---------- 工具栏 ---------- */
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  mode = b.dataset.mode;
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  render();
}));

let lock = null;
async function setWake(on) {
  const btn = $('wake');
  try {
    if (on) {
      lock = await navigator.wakeLock.request('screen');
      lock.addEventListener('release', () => { if (document.visibilityState === 'visible') btn.setAttribute('aria-pressed', 'false'); });
      btn.setAttribute('aria-pressed', 'true');
    } else {
      await lock?.release();
      lock = null;
      btn.setAttribute('aria-pressed', 'false');
    }
  } catch { btn.setAttribute('aria-pressed', 'false'); btn.textContent = '常亮不可用'; }
}
if ('wakeLock' in navigator) {
  $('wake').hidden = false;
  $('wake').addEventListener('click', () => setWake($('wake').getAttribute('aria-pressed') !== 'true'));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && $('wake').getAttribute('aria-pressed') === 'true') setWake(true); });
}
if (document.documentElement.requestFullscreen) {
  $('full').hidden = false;
  $('full').addEventListener('click', () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {}));
}

/* ---------- 时钟、相对时间与自动刷新 ---------- */
function tick() {
  $('clock').textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false });
}
tick();
setInterval(tick, 15000);
setInterval(render, 30000); // 相对时间与过期等级随时间推进，不必等下一次拉取

const onUpdate = result => { last = result; lastError = null; render(); };
const onError = error => { lastError = error; console.error('额度刷新失败', error); render(); };
startQuotaRefresh(onUpdate, { load, onError });
addEventListener('online', () => load().then(onUpdate, onError));
addEventListener('offline', render);
render();
</script>
</body>
